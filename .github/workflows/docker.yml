name: Docker image

on: 
  push:
    branches:
      - main
  
jobs:
  push_to_registry:
    name: Push Docker image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Push Docker image
        id: build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
          AWS_REGION: eu-west-1
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 244530008913.dkr.ecr.eu-west-1.amazonaws.com
          rev=$(git rev-parse --short HEAD)

          docker build . -t wishifai-app-k28

          docker tag wishifai-app-k28 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-app-k28:$rev
          docker tag wishifai-app-k28 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-app-k28:latest

          docker push 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-app-k28:$rev
          docker push 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-app-k28:latest

          echo "image_tag=$rev" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: push_to_registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Run Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
          AWS_REGION: eu-west-1
        run: |
          cd infra
          terraform fmt -check
          terraform init
          terraform plan -var="image_tag=${{ needs.push_to_registry.outputs.image_tag }}"
          terraform apply -auto-approve -var="image_tag=${{ needs.push_to_registry.outputs.image_tag }}"